name: Monitor de vagas de estágio

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6h (minuto 17 para fugir do pico do minuto 0)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Não enviar mensagens ao Telegram"
        type: boolean
        default: false
      max_vagas:
        description: "Teto de vagas analisadas nesta execução (vazio = MAX_VAGAS_POR_EXECUCAO)"
        required: false
        default: ""

permissions:
  contents: write   # necessário para commitar data/vagas.db e docs/index.html

concurrency:
  group: monitor-vagas
  cancel-in-progress: false   # nunca duas execuções escrevendo no mesmo .db

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o robô
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ajustes opcionais via Settings > Secrets and variables > Actions > Variables
          MIN_SCORE: ${{ vars.MIN_SCORE || '75' }}
          CLAUDE_MODEL_TRIAGEM: ${{ vars.CLAUDE_MODEL_TRIAGEM || 'claude-haiku-5-5' }}
          CLAUDE_MODEL_PITCH: ${{ vars.CLAUDE_MODEL_PITCH || 'claude-sonnet-5-5' }}
          ENABLE_SONNET_PITCH: ${{ vars.ENABLE_SONNET_PITCH || 'true' }}
          MAX_VAGAS_POR_EXECUCAO: ${{ vars.MAX_VAGAS_POR_EXECUCAO || '60' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.max_vagas }}" ]; then ARGS="$ARGS --max-vagas ${{ inputs.max_vagas }}"; fi
          python -m src.main $ARGS

      - name: Commitar banco e dashboard atualizados
        if: always()
        run: |
          git config user.name  "robo-vagas[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "chore(dados): atualiza vagas $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push falhou (tentativa $i), tentando de novo em $((i*5))s…"
            sleep $((i*5))
          done
          exit 1
